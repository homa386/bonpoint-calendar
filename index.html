<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>営業日カレンダー作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f4ec;
    --panel: #ffffff;
    --text: #545454;
    --muted: #8c857b;
    --accent: #b8aa92;
    --accent-dark: #8f8169;
    --border: #e4ddd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans JP", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    gap: 16px;
    grid-template-columns: minmax(0, 1fr);
  }
  @media (min-width: 860px) {
    main { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
    .intro { grid-column: 1 / -1; }
  }
  h1 { font-size: 20px; font-weight: 700; margin: 4px 0 0; }
  .lead { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .preview canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 6px;
    box-shadow: 0 2px 14px rgba(0, 0, 0, .1);
    cursor: pointer;
    touch-action: manipulation;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: grid;
    gap: 14px;
  }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-nav strong { flex: 1; text-align: center; font-size: 19px; }
  button, textarea {
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  button { padding: 8px 12px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary {
    background: var(--accent-dark);
    border-color: var(--accent-dark);
    color: #fff;
    padding: 13px;
    font-size: 16px;
    font-weight: 700;
  }
  .status { margin: 0; font-size: 13px; color: var(--muted); text-align: center; min-height: 1.5em; }
  .hint { margin: 0; font-size: 12px; color: var(--muted); }
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .weekdays button { padding: 8px 0; }
  .weekdays button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  textarea { width: 100%; padding: 8px 10px; line-height: 1.6; resize: vertical; }
  details summary { cursor: pointer; font-size: 14px; color: var(--muted); }
  details[open] summary { margin-bottom: 12px; }
  .field { display: grid; gap: 6px; }
  .field + .field { margin-top: 16px; }
  .field > span { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <section class="intro">
    <h1>営業日カレンダー作成</h1>
    <p class="lead">定休日（月・火）は最初から「休」が付いています。日付をタップすると「休」の付け外しができます。</p>
  </section>

  <section class="preview">
    <canvas id="cv" width="1080" height="1350" aria-label="カレンダーのプレビュー"></canvas>
  </section>

  <section class="panel">
    <div class="month-nav">
      <button id="prev" aria-label="前の月">◀</button>
      <strong id="monthLabel"></strong>
      <button id="next" aria-label="次の月">▶</button>
    </div>
    <p class="status" id="status"></p>
    <button id="reset">定休日だけの状態に戻す</button>
    <button class="primary" id="download">画像を保存</button>
    <p class="hint">スマホでは共有メニューが開くので「画像を保存」を選んでください。</p>

    <details>
      <summary>設定（定休日・営業時間）</summary>
      <div class="field">
        <span>定休日（毎月自動で「休」が付く曜日）</span>
        <div class="weekdays" id="weekly"></div>
      </div>
      <div class="field">
        <span>営業時間（1行ごとに「曜日 時間」）</span>
        <textarea id="hours" rows="2"></textarea>
        <button id="hoursReset">元に戻す</button>
      </div>
    </details>
  </section>
</main>

  // ---- Design (measured from the original 1080×1350 calendar) ----
  const COLOR = {
    bg: '#f8f4ec',
    cell: '#ffffff',
    line: '#b4b5b4',
    text: '#545454',
    sun: '#cd7574',
    sat: '#9ea1df',

  // ---- Storage ----
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem('bpcal:' + key); return v == null ? fallback : JSON.parse(v); }

    },
    set(key, value) {

  };
  const settings = Object.assign({}, DEFAULTS, store.get('settings', {}));
  const edited = store.get('closed', {}); // 'YYYY-MM' -> [day, ...]; months not here use the weekly holidays

  // ---- Japanese national holidays (current law) ----
  const holidayCache = {};
  function holidaysOf(y) {
    if (holidayCache[y]) return holidayCache[y];
    const nthMonday = (m, n) => 1 + (8 - new Date(y, m, 1).getDay()) % 7 + (n - 1) * 7;
    const t = y - 1980, leap = Math.floor(t / 4);
    const base = [
      [0, 1], [0, nthMonday(0, 2)], [1, 11], [1, 23],
      [2, Math.floor(20.8431 + 0.242194 * t - leap)],
      [3, 29], [4, 3], [4, 4], [4, 5], [6, nthMonday(6, 3)], [7, 11],
      [8, nthMonday(8, 3)], [8, Math.floor(23.2488 + 0.242194 * t - leap)],
      [9, nthMonday(9, 2)], [10, 3], [10, 23],
    ].map(([m, d]) => new Date(y, m, d));
    const k = (dt) => `${dt.getMonth()}-${dt.getDate()}`;
    const shift = (dt, n) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n);
    const set = new Set(base.map(k));
    for (const dt of base) {
      // 振替休日: a holiday on Sunday moves to the next non-holiday
      if (dt.getDay() === 0) {
        let next = shift(dt, 1);
        while (set.has(k(next))) next = shift(next, 1);
        set.add(k(next));
      }
      // 国民の休日: a day sandwiched between two holidays
      const mid = shift(dt, 1);
      if (!set.has(k(mid)) && base.some((o) => k(o) === k(shift(dt, 2)))) set.add(k(mid));

  const key = () => `${year}-${String(month + 1).padStart(2, '0')}`;
  const daysInMonth = () => new Date(year, month + 1, 0).getDate();

    }

  function measure(str, size, weight = 400, spacing = 0) {
    ctx.font = `${weight} ${size}px ${FONT}`;
    const chars = [...str];
    if (!spacing) return ctx.measureText(str).width;
    return chars.reduce((w, ch) => w + ctx.measureText(ch).width, 0) + spacing * (chars.length - 1);

    ctx.textAlign = spacing ? 'left' : align;
    if (!spacing) { ctx.fillText(str, x, y); return; }

    ctx.fillRect(GRID.left, GRID.top, GRID.right - GRID.left, GRID.bottom - GRID.top);

      const cx = GRID.left + colW * (wd + 0.5);
      const top = GRID.headBottom + rowH * Math.floor(idx / 7);
      cells.push({ d, x: cx - colW / 2, y: top, w: colW, h: rowH });
      text(String(d), cx, top + 53.4 * s, { size: 40, color: colorOf(wd, isHoliday(year, month, d)), align: 'center' });
      if (closed.has(d)) circle(cx, top + 103 * s, 35 * s, 34 * s);
    }

    // Footer: legend + business hours
    circle(142.5, 1241, 35, 31);
    text('...休業日', 188, 1256.1, { size: 33.5 });

    const lines = settings.hours.split('\n').map((l) => l.trim()).filter(Boolean)
      .map((l) => { const m = l.match(/^(\S+)\s+(.*)$/); return m ? [m[1], m[2]] : ['', l]; });
    if (lines.length) {
      const kanji = { size: 31 }, time = { size: 30, spacing: 0.33 }, lineH = 44;
      const dayW = Math.max(...lines.map(([a]) => measure(a, kanji.size)));
      const timeW = Math.max(...lines.map(([, b]) => measure(b, time.size, 400, time.spacing)));
      const timeX = 992 - timeW; // right edge of the hours column
      const dayX = timeX - (dayW ? dayW + 12.5 : 0);
      const firstBase = 1254 - (lines.length - 1) * lineH / 2;
      text('営業時間', dayX - 13.5 - measure('営業時間', kanji.size), 1255.6, kanji);
      lines.forEach(([a, b], i) => {
        const y = firstBase + i * lineH;
        text(a, dayX, y + 1.6, kanji);
        text(b, timeX, y, time);
      });
    }

    $('monthLabel').textContent = `${year}年${month + 1}月`;
    const isEdited = Boolean(edited[key()]);
    $('status').textContent = isEdited ? 'この月は手動で変更しています' : '定休日のみ';
    $('reset').disabled = !isEdited;
  }

  // Load the Noto Sans JP subsets for every character drawn, then draw
  async function render() {
    const chars = '営業日カレンダー0123456789日月火水木金土...休業時間' + settings.hours;
    try {
      await Promise.all([300, 400, 700].map((w) => document.fonts.load(`${w} 40px "Noto Sans JP"`, chars)));
    } catch {}
    draw();
  }

  // ---- Controls ----
  function renderWeekly() {
    const wrap = $('weekly');
    wrap.innerHTML = '';
    WEEK.forEach((label, wd) => {
      const on = settings.weekly.includes(wd);
      const b = document.createElement('button');
      b.textContent = label;
      b.className = on ? 'on' : '';
      b.setAttribute('aria-pressed', on);
      b.onclick = () => {
        settings.weekly = on ? settings.weekly.filter((w) => w !== wd) : [...settings.weekly, wd];
        saveSettings();
        renderWeekly();
        draw();
      };
      wrap.appendChild(b);
    });
    const names = settings.weekly.slice().sort().map((w) => WEEK[w]).join('・');
    document.querySelector('.lead').textContent = names
      ? `定休日（${names}）は最初から「休」が付いています。日付をタップすると「休」の付け外しができます。`
      : '日付をタップすると「休」の付け外しができます。';
  }

  cv.addEventListener('click', (e) => {
    const rect = cv.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (cv.width / rect.width);
    const y = (e.clientY - rect.top) * (cv.height / rect.height);
    const hit = cells.find((c) => x >= c.x && x < c.x + c.w && y >= c.y && y < c.y + c.h);
    if (!hit) return;
    const set = closedDays();
    if (set.has(hit.d)) set.delete(hit.d); else set.add(hit.d);
    saveClosed(set);
    draw();
  });

  $('prev').onclick = () => { month--; if (month < 0) { month = 11; year--; } draw(); };
  $('next').onclick = () => { month++; if (month > 11) { month = 0; year++; } draw(); };
  $('reset').onclick = () => { delete edited[key()]; store.set('closed', edited); draw(); };

  const hours = $('hours');
  hours.value = settings.hours;
  hours.addEventListener('input', () => { settings.hours = hours.value; saveSettings(); render(); });
  $('hoursReset').onclick = () => {
    settings.hours = hours.value = DEFAULTS.hours;
    saveSettings();
    render();
  };

  $('download').onclick = async () => {
    await render();
    cv.toBlob(async (blob) => {
      const name = `calendar-${key()}.png`;
      const file = new File([blob], name, { type: 'image/png' });
      // iPhone/Android: open the share sheet so the image can go straight to Photos
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; }
        catch (err) { if (err.name === 'AbortError') return; }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  };

  renderWeekly();
  draw();
  render();
})();
</script>
</body>
</html>
